services:
  cass1:
    image: cassandra:4.1
    container_name: cass1
    environment:
      CASSANDRA_CLUSTER_NAME: aerolinea_cluster
      CASSANDRA_SEEDS: cass1
      CASSANDRA_DC: dc1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 256M
    ports:
      - "9042:9042"
    volumes:
      - ./cql:/cql
      - cass1_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 20

  cass2:
    image: cassandra:4.1
    container_name: cass2
    environment:
      CASSANDRA_CLUSTER_NAME: aerolinea_cluster
      CASSANDRA_SEEDS: cass1
      CASSANDRA_DC: dc1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 256M
    volumes:
      - cass2_data:/var/lib/cassandra
    depends_on:
      cass1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 20

  cass3:
    image: cassandra:4.1
    container_name: cass3
    environment:
      CASSANDRA_CLUSTER_NAME: aerolinea_cluster
      CASSANDRA_SEEDS: cass1
      CASSANDRA_DC: dc1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 256M
    volumes:
      - cass3_data:/var/lib/cassandra
    depends_on:
      cass2:
        condition: service_healthy

volumes:
  cass1_data:
  cass2_data:
  cass3_data:
